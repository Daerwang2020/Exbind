[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exbind-benchmark"
version = "1.0.0"
description = "Anonymous data and evaluators for visual-to-symbolic binding"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]
